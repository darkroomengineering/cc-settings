name: ci

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review is not a default type; without it, leaving draft would
    # not start the test jobs skipped while the PR was a draft.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun:
    # Lint, typecheck and the Linux tests, from the org's shared workflow. The
    # lint step also runs bun audit and the fixture knowledge lint.
    uses: darkroomengineering/.github/.github/workflows/bun-ci.yml@main
    with:
      runs-on: '"ubuntu-latest"'
      lint: bun run lint:all
      # bun-ci checks out one commit on a push; install-e2e reads historical
      # commits with git, so the tests need the full history and its file contents.
      setup: if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --quiet --unshallow --refetch --no-filter; fi
      shards: 4
      # Tests read the repo's own files and run its scripts, which
      # `bun test --changed` cannot see through imports.
      full-test-paths: |
        .claude
        .claude-plugin
        .codex
        .context
        .mcp.json
        agents
        codex
        config
        docs
        evals
        hooks
        mcp-configs
        mcp.json
        npm-installer
        output-styles
        plugin.json
        plugins
        profiles
        rules
        schemas
        setup.ps1
        setup.sh
        site
        skills
        src
        tests/fixtures
        upstream
        AGENTS.md
        CHANGELOG.md
        CLAUDE-FULL.md
        MANUAL.md
        README.md
        SECURITY.md

  test:
    # Linux tests run in the bun job above. The full Windows suite takes ~23
    # minutes, so it runs only on pushes to main. PRs get Windows coverage from install-e2e and install-ps1-bootstrap.
    # Draft PRs skip it; it runs when the PR is marked ready for review.
    if: github.event_name == 'push' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["macos-latest","windows-latest"]') || fromJSON('["macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.1.30"
      - run: bun install --frozen-lockfile
      - run: bun test --parallel

  schemas:
    # Fails if `bun run schemas:emit` or `bun run manifests:emit` would produce a
    # diff — enforces that the committed JSON Schemas match the zod sources and
    # the install manifest records match the tracked source tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.1.30"
      - run: bun install --frozen-lockfile
      - run: bun run schemas:emit
      - run: git diff --exit-code schemas/
      - run: bun run manifests:emit
      - run: git diff --exit-code src/lib/generated/

  upstream-scan:
    # Dry-run in CI so any drift surfaces in the PR logs. Not a gate, and not
    # automated beyond this — run `/cc sync` by hand to triage the changelog
    # and land a bump.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.1.30"
      - run: bun install --frozen-lockfile
      - run: bun run upstream:scan

  install-e2e:
    # Windows install tests on PRs, where the full Windows `test` run is
    # skipped. On main the full suite covers these files. Draft PRs skip it too.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.1.30"
      - run: bun install --frozen-lockfile
      - name: Run install E2E tests (HOME=tmpdir, CC_SKIP_DEPS=1)
        run: bun test tests/install-e2e.test.ts tests/golden-migrations.test.ts

  install-bash-bootstrap:
    # Smoke test setup.sh's bootstrap path (the bash wrapper that ensures
    # Bun is installed before exec'ing bun src/setup.ts). --dry-run prints
    # the planned actions without writing — enough to validate setup.sh
    # parses and dispatches correctly.
    #
    # Linux + macOS only. Windows goes through setup.ps1, smoke-tested by
    # the install-ps1-bootstrap job below.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.1.30"
      - run: bun install --frozen-lockfile
      - name: bash setup.sh --dry-run
        run: bash setup.sh --dry-run
        env:
          # Use the runner's HOME so we don't accidentally pollute it with
          # cc-settings artifacts (--dry-run wouldn't, but defense-in-depth).
          CC_SKIP_DEPS: "1"

  install-ps1-bootstrap:
    # Smoke test setup.ps1's bootstrap path (PowerShell mirror of setup.sh):
    # validates it resolves the repo dir, finds Bun, installs deps, and
    # dispatches to src/setup.ts. --dry-run prints planned actions only.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.1.30"
      - run: bun install --frozen-lockfile
      - name: setup.ps1 --dry-run (pwsh)
        run: .\setup.ps1 --dry-run
        env:
          CC_SKIP_DEPS: "1"
      - name: setup.ps1 --dry-run (Windows PowerShell 5.1)
        # The default shell on most Windows boxes is still powershell.exe —
        # run the bootstrap there too so PS-5.1-only breakage gets caught.
        run: powershell -ExecutionPolicy Bypass -File setup.ps1 --dry-run
        shell: cmd
        env:
          CC_SKIP_DEPS: "1"
