name: win-debug
on:
  push:
    branches: [fix/windows-tests]
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.1.30"
      - run: bun install --frozen-lockfile
      - run: bun test
