name: win-debug
on:
  push:
    branches: [fix/windows-ci-failures]
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.1.30"
      - run: bun install --frozen-lockfile
      - run: bun .github/win-debug.ts
      - run: bun test tests/codex-hook.test.ts tests/codex-install.test.ts tests/safety-net.test.ts
